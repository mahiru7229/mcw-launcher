name: Build MCW Update Bridge

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target release that the bridge installs
        required: true
        default: latest
        type: string
      upload_to_release:
        description: Upload bridge binaries and checksums to the target GitHub release
        required: true
        default: true
        type: boolean
      upload_legacy_shim:
        description: Build and upload legacy bridge shim packages for v0.5.1-v1.5.0 auto-updates
        required: true
        default: true
        type: boolean
      activate_release_override:
        description: Upload MCW-USE-BRIDGE marker so launchers automatically use the bridge
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: Test bridge / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run bridge tests
        run: python -m pytest test/tools/test_update_bridge.py -q

      - name: Validate workflow target
        shell: bash
        run: |
          if [ -z '${{ inputs.release_tag }}' ]; then
            echo 'Target release_tag is required (e.g. "latest" or a release tag).' >&2
            exit 1
          fi

  build:
    name: Build bridge / ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            artifact: MCW-Update-Bridge-v1.7.1-windows-x64
            binary: dist/MCW-Update-Bridge-v1.7.1-windows-x64.exe
          - os: ubuntu-22.04
            platform: linux-x64
            artifact: MCW-Update-Bridge-v1.7.1-linux-x64
            binary: dist/MCW-Update-Bridge-v1.7.1-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade "PyInstaller>=6.16,<7"

      - name: Build Windows bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --icon 'assets/icons/mcw_launcher.ico' `
            --name 'MCW-Update-Bridge-v1.7.1-windows-x64' `
            tools/update_bridge/update_bridge.py

      - name: Build Linux bridge
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --console \
            --noupx \
            --exclude-module tkinter \
            --name 'MCW-Update-Bridge-v1.7.1-linux-x64' \
            tools/update_bridge/update_bridge.py
          chmod +x dist/MCW-Update-Bridge-v1.7.1-linux-x64

      - name: Build SHA-256 sidecar
        shell: python
        env:
          BRIDGE_BINARY: ${{ matrix.binary }}
        run: |
          import hashlib
          import os
          from pathlib import Path

          binary = Path(os.environ['BRIDGE_BINARY'])
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          binary.with_name(binary.name + '.sha256').write_bytes(
              f'{digest}  {binary.name}\n'.encode('ascii')
          )

      - name: Build legacy bridge shim package
        if: ${{ inputs.upload_legacy_shim }}
        shell: bash
        run: |
          VERSION='${{ inputs.release_tag }}'
          if [ "$VERSION" = "latest" ]; then
            VERSION=$(python -c 'from src.config import VERSION_ID; print(VERSION_ID)')
          else
            VERSION="${VERSION#v}"
          fi
          python tools/build_release_zip.py \
            --version "$VERSION" \
            --platform '${{ matrix.platform }}' \
            --legacy-bridge-shim '${{ matrix.binary }}' \
            --legacy-shim-output "dist/MCW-Launcher-LegacyBridge-v${VERSION}-${{ matrix.platform }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.sha256
            dist/MCW-Launcher-LegacyBridge-*

  publish:
    name: Upload bridge assets to target release
    if: ${{ inputs.upload_to_release }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download bridge artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: MCW-Update-Bridge-v1.7.1-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          chmod +x dist/MCW-Update-Bridge-*-linux-x64 2>/dev/null || true
          sed -i 's/\r$//' dist/*.sha256
          (cd dist && sha256sum --check ./*.sha256)

      - name: Upload legacy shims first to target release
        if: ${{ inputs.upload_legacy_shim }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET='${{ inputs.release_tag }}'
          if [ "$TARGET" = "latest" ]; then
            TARGET=$(gh release view --json tagName -q .tagName --repo '${{ github.repository }}')
          fi
          gh release upload "$TARGET" \
            dist/MCW-Launcher-LegacyBridge-* \
            --repo '${{ github.repository }}' \
            --clobber

      - name: Upload bridges to target release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET='${{ inputs.release_tag }}'
          if [ "$TARGET" = "latest" ]; then
            TARGET=$(gh release view --json tagName -q .tagName --repo '${{ github.repository }}')
          fi
          gh release upload "$TARGET" \
            dist/MCW-Update-Bridge-* \
            --repo '${{ github.repository }}' \
            --clobber

      - name: Activate emergency bridge override
        if: ${{ inputs.activate_release_override || inputs.upload_legacy_shim }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET='${{ inputs.release_tag }}'
          if [ "$TARGET" = "latest" ]; then
            TARGET=$(gh release view --json tagName -q .tagName --repo '${{ github.repository }}')
          fi
          printf 'MCW Launcher emergency bridge override\n' > MCW-USE-BRIDGE
          gh release upload "$TARGET" MCW-USE-BRIDGE \
            --repo '${{ github.repository }}' \
            --clobber
