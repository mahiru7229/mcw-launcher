name: Build MCW Update Bridge

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target release that the bridge installs
        required: true
        default: v1.5.1-beta.3
        type: string
      upload_to_release:
        description: Upload bridge binaries and checksums to the target GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: Test bridge / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run bridge tests
        run: python -m pytest test/tools/test_update_bridge.py -q

      - name: Validate workflow target
        shell: bash
        run: |
          if [ '${{ inputs.release_tag }}' != 'v1.5.1-beta.3' ]; then
            echo 'Bridge 1.2.0 is intentionally pinned to v1.5.1-beta.3. Update the bridge source and tests before changing the target.' >&2
            exit 1
          fi

  build:
    name: Build bridge / ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            artifact: MCW-Update-Bridge-v1.2.0-windows-x64
            binary: dist/MCW-Update-Bridge-v1.2.0-windows-x64.exe
          - os: ubuntu-22.04
            platform: linux-x64
            artifact: MCW-Update-Bridge-v1.2.0-linux-x64
            binary: dist/MCW-Update-Bridge-v1.2.0-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller==6.22.2

      - name: Build Windows bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --icon 'assets/icons/mcw_launcher.ico' `
            --name 'MCW-Update-Bridge-v1.2.0-windows-x64' `
            tools/update_bridge/update_bridge.py

      - name: Build Linux bridge
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --console \
            --noupx \
            --exclude-module tkinter \
            --name 'MCW-Update-Bridge-v1.2.0-linux-x64' \
            tools/update_bridge/update_bridge.py
          chmod +x dist/MCW-Update-Bridge-v1.2.0-linux-x64

      - name: Build SHA-256 sidecar
        shell: python
        env:
          BRIDGE_BINARY: ${{ matrix.binary }}
        run: |
          import hashlib
          import os
          from pathlib import Path

          binary = Path(os.environ['BRIDGE_BINARY'])
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          binary.with_name(binary.name + '.sha256').write_text(
              f'{digest}  {binary.name}\n', encoding='utf-8'
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.sha256

  publish:
    name: Upload bridge assets to target release
    if: ${{ inputs.upload_to_release }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download bridge artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: MCW-Update-Bridge-v1.2.0-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: |
          chmod +x dist/MCW-Update-Bridge-v1.2.0-linux-x64
          (cd dist && sha256sum --check ./*.sha256)

      - name: Upload bridges to target release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ inputs.release_tag }}' \
            dist/MCW-Update-Bridge-v1.2.0-windows-x64.exe \
            dist/MCW-Update-Bridge-v1.2.0-windows-x64.exe.sha256 \
            dist/MCW-Update-Bridge-v1.2.0-linux-x64 \
            dist/MCW-Update-Bridge-v1.2.0-linux-x64.sha256 \
            --clobber
