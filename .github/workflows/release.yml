name: Build Beta, RC and Stable Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate Beta, RC or Stable release
    if: >-
      startsWith(github.event.release.tag_name, 'v') &&
      (contains(github.event.release.tag_name, '-beta.') ||
      contains(github.event.release.tag_name, '-rc.') ||
      !contains(github.event.release.tag_name, '-'))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag and channel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from src.config import UPDATE_CHANNEL, VERSION_TAG

          tag = os.environ["RELEASE_TAG"]
          is_prerelease = os.environ["RELEASE_IS_PRERELEASE"].casefold() == "true"
          is_beta = "-beta." in tag
          is_rc = "-rc." in tag
          is_prerelease_version = is_beta or is_rc
          if VERSION_TAG != tag:
              raise SystemExit(f"Release tag {tag!r} does not match src.config.VERSION_TAG {VERSION_TAG!r}.")
          if is_prerelease_version and not is_prerelease:
              release_kind = "Beta" if is_beta else "RC"
              raise SystemExit(f"A {release_kind} tag must be published as a GitHub pre-release.")
          if not is_prerelease_version and is_prerelease:
              raise SystemExit("A Stable tag must not be published as a GitHub pre-release.")
          expected_channel = "beta" if is_prerelease_version else "stable"
          if UPDATE_CHANNEL != expected_channel:
              raise SystemExit(f"UPDATE_CHANNEL must be {expected_channel!r}, got {UPDATE_CHANNEL!r}.")
          PY

  tests:
    name: Test / ${{ matrix.os }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q launcher.py src mcw_core tools

      - name: Run release preflight
        run: python -m tools.release_preflight

      - name: Run complete regression suite
        run: python -m pytest test -q

  build:
    name: Build / ${{ matrix.platform }}
    needs: [release-gate, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: dist/MCW Launcher.exe
          - os: ubuntu-22.04
            platform: linux-x64
            executable: dist/mcw-launcher
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Read launcher version
        id: version
        shell: python
        run: |
          import os
          from src.config import VERSION_ID
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={VERSION_ID}\n")

      - name: Build native executable
        run: python -m PyInstaller --clean --noconfirm mcw_launcher.spec

      - name: Build release ZIP and checksum
        run: >-
          python -m tools.build_release_zip
          --exe "${{ matrix.executable }}"
          --version "${{ steps.version.outputs.version }}"
          --platform "${{ matrix.platform }}"

      - name: Upload package for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/MCW-Launcher-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
            release/MCW-Launcher-v${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish-assets:
    name: Upload assets to GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 2
          (cd release && sha256sum --check ./*.sha256)

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" release/*
          --repo "${{ github.repository }}"
          --clobber
