[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcw-launcher"
version = "1.5.0b2"
description = "Instance-first Minecraft launcher for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mahiru7229"}]
dependencies = [
    "PySide6>=6.8,<7",
    "cryptography>=46,<47",
    "httpx[socks]>=0.28,<1",
    "requests>=2.32,<3",
    "keyring>=25,<26; sys_platform == 'linux'",
    "SecretStorage>=3.3,<4; sys_platform == 'linux'",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
mcw-launcher = "launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]
build = [
    "PyInstaller>=6.16,<7",
]

[tool.setuptools]
py-modules = ["launcher"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcw_core*", "src*"]
exclude = ["test*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
"mcw_core.resources" = ["*.jar"]
